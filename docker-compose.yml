services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cheshire_cat
      POSTGRES_USER: cat
      POSTGRES_PASSWORD: meow
    ports:
      - "5432:5432"
    volumes:
      - cheshire-cat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat -d cheshire_cat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cheshire-cat-postgres:
