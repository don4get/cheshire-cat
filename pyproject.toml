[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cheshire-cat"
version = "0.1.0"
description = "A reproducible stock research, filing archive, dashboard, and backtesting toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cheshire Cat contributors" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
market-data = ["yfinance>=0.2.40", "curl-cffi>=0.7"]
reports = ["beautifulsoup4>=4.12", "markdownify>=0.13", "pypdf>=4.0"]
dashboard = ["dash>=2.17", "plotly>=5.22"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
legacy = ["yahooquery>=2.3"]
all = [
  "yfinance>=0.2.40",
  "curl-cffi>=0.7",
  "yahooquery>=2.3",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "pypdf>=4.0",
  "dash>=2.17",
  "plotly>=5.22",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cheshire-cat = "cheshire_cat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cheshire_cat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
